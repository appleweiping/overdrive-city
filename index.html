<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OVERDRIVE CITY</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="OVERDRIVE CITY — an original browser-based 3D open-world driving game. One vendored dependency, no build step, everything procedural.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
<style>
  :root{
    --hud-bg: rgba(8,10,16,.55);
    --hud-edge: rgba(255,255,255,.14);
    --accent: #ffcc33;
    --danger: #ff4b4b;
    --ok: #58d68d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:#eee;
    -webkit-user-select:none;user-select:none}
  canvas#game{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  .panel{background:var(--hud-bg);border:1px solid var(--hud-edge);
    border-radius:8px;backdrop-filter:blur(3px)}

  #stars{position:fixed;top:14px;right:16px;font-size:26px;letter-spacing:4px;
    text-shadow:0 0 6px rgba(0,0,0,.8)}
  #stars .on{color:var(--accent)}
  #stars .off{color:rgba(255,255,255,.22)}
  #stars.flash .on{animation:starflash .5s steps(2) infinite}
  @keyframes starflash{50%{color:#fff}}

  #cashbox{position:fixed;top:14px;left:16px;padding:8px 14px;font-size:22px;
    font-weight:700;color:var(--ok);text-shadow:0 1px 2px #000}
  #pending{font-size:13px;font-weight:600;color:var(--accent);margin-top:2px}

  #objective{position:fixed;top:14px;left:50%;transform:translateX(-50%);
    min-width:260px;max-width:46vw;padding:8px 16px;text-align:center;display:none}
  #objective .title{color:var(--accent);font-weight:700;font-size:14px;
    text-transform:uppercase;letter-spacing:1px}
  #objective .text{font-size:15px;margin-top:2px}
  #objective .bar{height:5px;margin-top:6px;background:rgba(255,255,255,.15);
    border-radius:3px;overflow:hidden}
  #objective .bar>div{height:100%;width:100%;background:var(--accent)}

  #vitals{position:fixed;left:16px;bottom:16px;width:210px;padding:10px 12px}
  .vbar{height:9px;border-radius:5px;background:rgba(255,255,255,.13);
    overflow:hidden;margin-top:6px}
  .vbar>div{height:100%;border-radius:5px}
  #hpbar>div{background:var(--danger);width:100%}
  #apbar>div{background:#5dade2;width:0%}
  #weapon{margin-top:8px;font-size:14px;color:#ddd}
  #weapon b{color:#fff;font-size:15px}

  #mapbox{position:fixed;right:16px;bottom:16px;width:188px;padding:8px;text-align:center}
  #minimap{width:170px;height:170px;border-radius:6px;display:block;margin:0 auto}
  #speedrow{display:flex;justify-content:space-between;margin-top:6px;
    font-size:13px;color:#cfd8dc}
  #speed b{color:#fff;font-size:16px}

  #banner{position:fixed;top:38%;left:0;right:0;text-align:center;display:none;
    font-size:64px;font-weight:900;letter-spacing:8px;
    text-shadow:0 0 24px rgba(0,0,0,.9),0 4px 0 rgba(0,0,0,.6)}
  #banner.down{color:var(--danger)}
  #banner.cuffed{color:#5dade2}
  #banner.passed{color:var(--ok)}
  #banner.failed{color:#f39c12}
  #banner small{display:block;font-size:18px;letter-spacing:2px;color:#eee;font-weight:600}

  #toasts{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:6px}
  .toast{padding:6px 18px;border-radius:16px;background:var(--hud-bg);
    border:1px solid var(--hud-edge);font-size:14px;animation:toast 4s forwards}
  @keyframes toast{0%{opacity:0;transform:translateY(10px)}8%{opacity:1;transform:none}
    80%{opacity:1}100%{opacity:0}}

  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    font-size:13px;color:#cfd8dc;padding:5px 14px;display:none}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:
    radial-gradient(ellipse at 50% 30%,rgba(30,25,60,.92),rgba(3,3,8,.97));
    z-index:10;text-align:center}
  #title h1{font-size:min(11vw,92px);font-weight:900;letter-spacing:6px;line-height:.95;
    background:linear-gradient(180deg,#ffe28a 0%,#ffcc33 45%,#ff7847 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(255,150,60,.25))}
  #title .sub{margin-top:8px;font-size:15px;color:#b9c2cc;letter-spacing:3px;
    text-transform:uppercase}
  #title .start{margin-top:42px;font-size:20px;color:#fff;padding:14px 42px;
    border:2px solid var(--accent);border-radius:10px;cursor:pointer;
    background:rgba(255,204,51,.08);pointer-events:auto;transition:.15s}
  #title .start:hover{background:rgba(255,204,51,.22);transform:scale(1.04)}
  #title .controls{margin-top:38px;font-size:13.5px;color:#aab4bf;line-height:1.9}
  #title .controls b{color:#e8edf2;background:rgba(255,255,255,.09);
    border:1px solid var(--hud-edge);border-radius:4px;padding:1px 7px;margin:0 2px}
  #title .best{margin-top:18px;font-size:14px;color:var(--ok)}
  #title .touch{margin:22px 16px 0;max-width:420px;padding:10px 14px;font-size:14px;
    line-height:1.5;color:#ffd98a;border:1px solid rgba(255,204,51,.45);border-radius:8px;
    background:rgba(255,204,51,.08)}
  #title .foot{position:absolute;bottom:14px;font-size:12px;color:#5d6771}
  #title .foot a{color:#8fa3b8}
  #pause{display:none}
  #pause h2{font-size:44px;letter-spacing:6px;color:#fff}
  #pause p{margin-top:14px;color:#aab4bf}
  #loading{font-size:18px;letter-spacing:3px;color:#b9c2cc}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="stars"></div>
  <div id="cashbox" class="panel">$<span id="cash">0</span><div id="pending"></div></div>
  <div id="objective" class="panel">
    <div class="title"></div><div class="text"></div>
    <div class="bar"><div></div></div>
  </div>
  <div id="vitals" class="panel">
    <div class="vbar" id="hpbar"><div></div></div>
    <div class="vbar" id="apbar"><div></div></div>
    <div id="weapon"><b>Fists</b></div>
  </div>
  <div id="mapbox" class="panel">
    <canvas id="minimap" width="340" height="340"></canvas>
    <div id="speedrow"><span id="clock">08:00</span><span id="speed"><b>0</b> km/h</span></div>
  </div>
  <div id="banner"></div>
  <div id="toasts"></div>
  <div id="hint" class="panel"></div>
</div>

<div id="title" class="overlay">
  <div id="loading">GENERATING CITY…</div>
</div>
<div id="pause" class="overlay">
  <h2>PAUSED</h2>
  <p>Esc / P — resume &nbsp;·&nbsp; M — mute</p>
</div>

<script type="importmap">
  {"imports": {"three": "./lib/three.module.js"}}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
